services:
  db:
    image: pgvector/pgvector:pg16
    container_name: archlens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archlens}
      POSTGRES_USER: ${POSTGRES_USER:-archlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archlens_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - archlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archlens} -d ${POSTGRES_DB:-archlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: archlens-neo4j
    restart: unless-stopped
    environment:
      # Community edition, no plugins/APOC — the graph queries this
      # phase needs (fixed-length variable-hop traversals) are plain
      # Cypher, no extension required. Free, local, no license needed.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-archlens_dev_password}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - archlens_neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  archlens_pgdata:
  archlens_neo4jdata:
