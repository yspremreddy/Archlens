[project]
name = "archlens"
version = "0.1.0"
description = "ArchLens — AI Architecture Risk & Compliance Reviewer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "fastembed>=0.4",
    "httpx>=0.27",
    "neo4j>=5.24",
    "rapidocr-onnxruntime>=1.3",
    "pypdfium2>=4.30",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
