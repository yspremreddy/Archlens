name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests (UI-only, no backend)
        run: npx playwright test e2e/smoke.spec.ts

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: archlens_test
          POSTGRES_USER: archlens
          POSTGRES_PASSWORD: archlens_dev_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U archlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/archlens_dev_password
        ports: ['7687:7687']
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: archlens_test
      POSTGRES_USER: archlens
      POSTGRES_PASSWORD: archlens_dev_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: archlens_dev_password
      LLM_PROVIDER: template
      VISION_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.12.12'
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
